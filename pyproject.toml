[project]
name = "ari"
version = "0.0.2"
requires-python = ">=3.11"
dependencies = [
  "python-telegram-bot>=21",
  "aiosqlite>=0.20",
  "sqlite-vec>=0.1.3",
  "fastembed>=0.4",
  "pydantic-settings>=2.5",
  "croniter>=2.0",
  "tzdata>=2024.1",
  "mcp>=2.2,<3",
  "cryptography>=43",
  "pypdf>=5",
  "openpyxl>=3.1",
]

[project.optional-dependencies]
dev = ["pytest>=8", "pytest-asyncio>=0.24", "ruff>=0.6"]
# Speaker diarization for the groq_audio skill. Heavy (pulls torch); install with
# `pip install -e '.[diarization]'`. Also needs the user to accept the model
# conditions on Hugging Face for pyannote/speaker-diarization-3.1 and
# pyannote/segmentation-3.0, using the HUGGINGFACE_TOKEN loaded in the vault.
# omegaconf is required to load the legacy pyannote/embedding checkpoint but
# pyannote.audio 4.x does not declare it, so we pin it here explicitly.
diarization = ["pyannote.audio>=3.1", "omegaconf>=2.1"]

[project.scripts]
ari = "ari.main:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/ari"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
pythonpath = ["src"]
testpaths = ["tests"]
markers = ["slow: downloads a model / hits the network"]

[tool.ruff]
line-length = 100
src = ["src", "tests"]
